    // Animated Counter Component
    function AnimatedCounter({ end, duration = 2000, suffix = '' }) {
      const [count, setCount] = useState(0);
      const [isVisible, setIsVisible] = useState(false);
      const ref = useRef(null);
      
      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
            }
          },
          { threshold: 0.1 }
        );
        
        if (ref.current) {
          observer.observe(ref.current);
        }
        
        return () => observer.disconnect();
      }, []);
      
      useEffect(() => {
        if (!isVisible) return;
        
        let startTime;
        const animate = (currentTime) => {
          if (!startTime) startTime = currentTime;
          const progress = Math.min((currentTime - startTime) / duration, 1);
          setCount(Math.floor(progress * end));
          
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        
        requestAnimationFrame(animate);
      }, [isVisible, end, duration]);
      
      return <span ref={ref}>{count}{suffix}</span>;
    }

    // BeforeAfter Component
    function BeforeAfter() {
      const [sliderPosition, setSliderPosition] = useState(50);
      const containerRef = useRef(null);
      const isDragging = useRef(false);
      
      const handleMove = (clientX) => {
        if (!containerRef.current || !isDragging.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const x = clientX - rect.left;
        const percentage = Math.min(Math.max((x / rect.width) * 100, 0), 100);
        setSliderPosition(percentage);
      };
      
      const handleMouseDown = () => { isDragging.current = true; };
      const handleMouseUp = () => { isDragging.current = false; };
      const handleMouseMove = (e) => handleMove(e.clientX);
      const handleTouchMove = (e) => handleMove(e.touches[0].clientX);
      
      useEffect(() => {
        document.addEventListener('mouseup', handleMouseUp);
        document.addEventListener('mousemove', handleMouseMove);
        return () => {
          document.removeEventListener('mouseup', handleMouseUp);
          document.removeEventListener('mousemove', handleMouseMove);
        };
      }, []);
      
      return (
        <section className="py-24 bg-white">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center mb-16">
              <span className="inline-block text-primary-DEFAULT font-semibold mb-4">See The Difference</span>
              <h2 className="font-display text-3xl sm:text-4xl lg:text-5xl font-bold text-foreground mb-6">
                Before & After Transformation
              </h2>
              <p className="text-lg text-muted-foreground max-w-2xl mx-auto">
                Drag the slider to see the amazing transformation our cleaning brings
              </p>
            </div>
            
            <div className="max-w-4xl mx-auto">
              <div 
                ref={containerRef}
                className="relative rounded-3xl overflow-hidden cursor-ew-resize shadow-2xl aspect-video"
                onMouseDown={handleMouseDown}
                onTouchStart={handleMouseDown}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleMouseUp}
              >
                {/* After image (background) */}
                <img 
                  src="https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1200&h=675&fit=crop"
                  alt="After cleaning"
                  className="absolute inset-0 w-full h-full object-cover"
                />
                
                {/* Before image (clipped) */}
                <div className="absolute inset-0 overflow-hidden" style={{clipPath: `inset(0 ${100 - sliderPosition}% 0 0)`}}>
                  <img 
                    src="https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?w=1200&h=675&fit=crop"
                    alt="Before cleaning"
                    className="absolute inset-0 w-full h-full object-cover"
                    style={{filter: 'sepia(30%) brightness(0.8)'}}
                  />
                </div>
                
                {/* Slider handle */}
                <div 
                  className="absolute top-0 bottom-0 w-1 bg-white cursor-ew-resize z-10"
                  style={{left: `${sliderPosition}%`, transform: 'translateX(-50%)'}}
                >
                  <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center">
                    <div className="flex items-center gap-1">
                      <Icons.ChevronLeft />
                      <Icons.ChevronRight />
                    </div>
                  </div>
                </div>
                
                {/* Labels */}
                <div className="absolute top-4 left-4 bg-black/50 text-white px-4 py-2 rounded-full text-sm font-medium">Before</div>
                <div className="absolute top-4 right-4 bg-primary-DEFAULT text-white px-4 py-2 rounded-full text-sm font-medium">After</div>
              </div>
            </div>
          </div>
        </section>
      );
    }
